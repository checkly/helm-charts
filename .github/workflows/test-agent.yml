name: Test agent chart

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'charts/agent/**'
      - '.github/workflows/test-agent.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1
      - run: helm lint charts/agent
      - run: helm unittest --strict charts/agent
