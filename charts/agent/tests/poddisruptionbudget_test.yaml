suite: Pod disruption budget
templates:
- poddisruptionbudget.yaml
release:
  name: ci-agent
  namespace: checkly-agent
tests:
- it: omit disruption budget by default
  asserts:
  - hasDocuments:
      count: 0
- it: keep minAvailable 1
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.minAvailable: 1
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: PodDisruptionBudget
  - isAPIVersion:
      of: policy/v1
  - equal:
      path: spec.minAvailable
      value: 1
  - notExists:
      path: spec.maxUnavailable
  - equal:
      path: spec.selector.matchLabels
      value:
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: ci-agent
- it: keep minAvailable 50%
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.minAvailable: 50%
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: PodDisruptionBudget
  - isAPIVersion:
      of: policy/v1
  - equal:
      path: spec.minAvailable
      value: 50%
  - notExists:
      path: spec.maxUnavailable
  - equal:
      path: spec.selector.matchLabels
      value:
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: ci-agent
- it: keep minAvailable 0
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.minAvailable: 0
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: PodDisruptionBudget
  - isAPIVersion:
      of: policy/v1
  - equal:
      path: spec.minAvailable
      value: 0
  - notExists:
      path: spec.maxUnavailable
  - equal:
      path: spec.selector.matchLabels
      value:
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: ci-agent
- it: keep maxUnavailable 1
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.maxUnavailable: 1
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: PodDisruptionBudget
  - isAPIVersion:
      of: policy/v1
  - equal:
      path: spec.maxUnavailable
      value: 1
  - notExists:
      path: spec.minAvailable
  - equal:
      path: spec.selector.matchLabels
      value:
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: ci-agent
- it: keep maxUnavailable 50%
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.maxUnavailable: 50%
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: PodDisruptionBudget
  - isAPIVersion:
      of: policy/v1
  - equal:
      path: spec.maxUnavailable
      value: 50%
  - notExists:
      path: spec.minAvailable
  - equal:
      path: spec.selector.matchLabels
      value:
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: ci-agent
- it: keep maxUnavailable 0
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.maxUnavailable: 0
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: PodDisruptionBudget
  - isAPIVersion:
      of: policy/v1
  - equal:
      path: spec.maxUnavailable
      value: 0
  - notExists:
      path: spec.minAvailable
  - equal:
      path: spec.selector.matchLabels
      value:
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: ci-agent
- it: omit null limit
  set:
    podDisruptionBudget.enabled: true
    podDisruptionBudget.minAvailable: null
    podDisruptionBudget.maxUnavailable: 1
  asserts:
  - notExists:
      path: spec.minAvailable
  - equal:
      path: spec.maxUnavailable
      value: 1
