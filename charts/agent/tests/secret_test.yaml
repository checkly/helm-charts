suite: API key Secret
templates:
- deployment.yaml
- secret.yaml
release:
  name: ci-agent
  namespace: checkly-agent
tests:
- it: create encoded API key and its reference
  set:
    apiKeySecret.apiKey: test:key/with+symbols=
  asserts:
  - hasDocuments:
      count: 1
    template: secret.yaml
  - isKind:
      of: Secret
    template: secret.yaml
  - isAPIVersion:
      of: v1
    template: secret.yaml
  - equal:
      path: metadata
      value:
        name: ci-agent-auth
        namespace: checkly-agent
    template: secret.yaml
  - equal:
      path: data.apiKey
      value: test:key/with+symbols=
      decodeBase64: true
    template: secret.yaml
  - equal:
      path: spec.template.spec.containers[0].env
      value:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: ci-agent-auth
            key: apiKey
    template: deployment.yaml
- it: use existing secret with default key
  set:
    apiKeySecret.create: false
    apiKeySecret.name: existing-auth
  asserts:
  - hasDocuments:
      count: 0
    template: secret.yaml
  - equal:
      path: spec.template.spec.containers[0].env
      value:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: existing-auth
            key: apiKey
    template: deployment.yaml
- it: use existing secret with custom key
  set:
    apiKeySecret.create: false
    apiKeySecret.name: existing-auth
    apiKeySecret.key: token
  asserts:
  - hasDocuments:
      count: 0
    template: secret.yaml
  - equal:
      path: spec.template.spec.containers[0].env
      value:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: existing-auth
            key: token
    template: deployment.yaml
