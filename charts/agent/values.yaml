# Default values for agent.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# Ignored when autoscaling.enabled is true: the replica count is then managed by the autoscaler.
replicaCount: 1

# Autoscale the agents with KEDA based on the number of queued and in-flight check runs.
# More information can be found here: https://www.checklyhq.com/docs/platform/private-locations/autoscaling/
#
# Requires KEDA installed in the cluster and Prometheus V2 metrics ingestion
# (the checkly_private_location_check_runs metric) available in a Prometheus-compatible server.
autoscaling:
  enabled: false
  scaledObject:
    # Set to false if you manage your own ScaledObject or HPA for the agent Deployment.
    # The chart then only leaves spec.replicas unset, and the other autoscaling values are not used.
    create: true
  minReplicaCount: 2
  maxReplicaCount: 10
  # How often KEDA checks the trigger (KEDA default: 30). The metric is aggregated over ~1 minute.
  pollingInterval:
  # Slug of the private location, used to build the default query
  privateLocationSlugName: ""
  # Check runs per pod before scaling up. Defaults to env.JOB_CONCURRENCY, or 1.
  threshold: ""
  # Override the default query. Supports templating.
  # default: sum(checkly_private_location_check_runs{state=~"queued|inflight", private_location_slug_name="<privateLocationSlugName>"})
  query: ""
  prometheus:
    serverAddress: ""
    # Reference to a KEDA TriggerAuthentication if your Prometheus server requires authentication.
    # Also set metadata.authModes: KEDA 2.17 and older only read it from the trigger metadata.
    # authenticationRef:
    #   name: keda-prometheus-auth
    authenticationRef: {}
    # Extra metadata for the Prometheus trigger: https://keda.sh/docs/latest/scalers/prometheus/
    # metadata:
    #   authModes: basic
    #   unsafeSsl: "true"
    metadata: {}
  # HPA scaling behavior
  behavior:
    scaleUp:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: docker.io/checkly/agent
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is the configuration of the agent's internal metrics server
metrics:
  port: 8080

# Configures secret for agent API Key
#
# If you already have a secret with the Key, set `create` to
# false and set the `name` and `key` of your secret.
#
# If you don't have a secret, set `create` to true
# and set the `apiKey` value to your Key.
#
# You can also create a secret yourself via extraManifests[].
# Set `create` to false and set `name` to the name of
# your secret defined in your extraManifests.
apiKeySecret:
  create: true
  apiKey: ""

# default 330, so in-flight checks (300s timeout) can complete on terminating pods
terminationGracePeriodSeconds:

# Update strategy for the deployment
# default:
#
# strategy:
#   type: "RollingUpdate"
#   rollingUpdate:
#     maxSurge: 10%
#     maxUnavailable: 0
#
# maxUnavailable of zero is recommended to always have enough
# capacity to run your checks
strategy: {}

# Extra environment variables to be passed to agent pods
#
# env:
#   MY_ENV_VAR: myvalue
#   ANOTHER_VAR: anothervalue
env: {}

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 10001

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
readinessProbe: {}

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
# podAntiAffinity:
#   requiredDuringSchedulingIgnoredDuringExecution:
#     - labelSelector:
#         matchExpressions:
#           - key: app.kubernetes.io/name
#             operator: In
#             values:
#               - agent
#           - key: app.kubernetes.io/instance
#             operator: In
#             values:
#               - RELEASE-NAME
#       topologyKey: kubernetes.io/hostname

# https://kubernetes.io/docs/tasks/run-application/configure-pdb/
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
  # Only one of minAvailable or maxUnavailable can be set

# https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []
# Example configurations:
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: agent
# - maxSkew: 1
#   topologyKey: kubernetes.io/hostname
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: agent
